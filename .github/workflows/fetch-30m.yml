name: 30m CleanSYS Real-Time API Cron

on:
  schedule:
    # 매 시간 5분 및 35분에 정기 트리거
    - cron: '5 * * * *'
    - cron: '35 * * * *'
  workflow_dispatch:  # 수동 실행 버튼 제공

jobs:
  fetch-30m:
    runs-on: ubuntu-latest
    steps:
      - name: Continuous 30m Real-Time Fetch Loop (Idempotent)
        run: |
          echo "=== CleanSYS 30분 실측 상시 수집 루프 가동 ==="
          # 1회 실행 시 30분 동안 10분 간격으로 총 3회 수집 시도 (GitHub 스케줄러 지연 시에도 완벽 커버)
          for i in 1 2 3; do
            echo "--- 수집 시도 #$i ($(date '+%Y-%m-%d %H:%M:%S KST')) ---"
            HTTP_RESPONSE=$(curl -s -o /tmp/response_body.txt -w "%{http_code}" \
              -X GET "https://sctmsmonitor.vercel.app/api/cron/fetch-30m" \
              -H "User-Agent: GitHub-Actions-Cron" \
              --retry 3 \
              --retry-delay 5 \
              --max-time 60)
            echo "HTTP Status: $HTTP_RESPONSE"
            cat /tmp/response_body.txt || true
            echo ""
            if [ "$i" -lt 3 ]; then
              echo "다음 주기까지 10분(600초) 대기..."
              sleep 600
            fi
          done
          echo "=== 30분 상시 수집 루프 완료 ==="

