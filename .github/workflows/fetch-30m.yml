name: 30m CleanSYS Real-Time API Cron

on:
  schedule:
    # Runs every 30 minutes (00, 30 min of every hour)
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  fetch-30m:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CleanSYS 30m Real-Time API Fetch & Google Sheets Accumulation
        run: |
          curl -X GET "https://sctmsmonitor.vercel.app/api/cron/fetch-30m" \
            -H "User-Agent: GitHub-Actions-Cron" \
            --fail --silent --show-error
